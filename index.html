<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WoW Death Counter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap');

        body {
            margin: 0;
            padding: 20px;
            background-color: transparent;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
        }

        /* Main OBS Widget Box */
        .widget-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 440px;
            height: 95px;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            border: 2px solid #c79c2e; /* WoW Gold Accent */
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            padding: 0 20px;
            box-sizing: border-box;
        }

        .left-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .main-label {
            font-size: 26px;
            font-weight: 900;
            color: #c79c2e; /* WoW Gold */
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            line-height: 1.1;
        }

        .right-section {
            display: flex;
            gap: 10px;
        }

        .counter-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(25, 25, 25, 0.8);
            border: 1px solid #444;
            border-radius: 8px;
            width: 85px;
            height: 65px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .counter-value {
            font-size: 30px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.1;
        }

        .counter-sub {
            font-size: 8px;
            font-weight: 700;
            color: #888888;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        /* Control Panels for Streamer */
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-panel {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #444;
            align-items: center;
        }

        .control-label {
            color: #c79c2e;
            font-weight: 800;
            font-size: 13px;
            width: 55px;
        }

        .control-panel button {
            background: #c79c2e;
            color: #111;
            border: none;
            font-weight: 800;
            font-size: 14px;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .control-panel button:hover {
            background: #e6b839;
        }

        .control-panel input {
            width: 50px;
            background: #222;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            padding: 4px;
        }
    </style>
</head>
<body>

    <!-- OBS Widget Display -->
    <div class="widget-container">
        <div class="left-section">
            <div class="main-label">DEATHS</div>
        </div>
        <div class="right-section">
            <div class="counter-box">
                <div class="counter-value" id="jake-display">0</div>
                <div class="counter-sub">JAKE</div>
            </div>
            <div class="counter-box">
                <div class="counter-value" id="joe-display">0</div>
                <div class="counter-sub">JOE</div>
            </div>
        </div>
    </div>

    <!-- Streamer Control Panels -->
    <div class="controls-wrapper">
        <div class="control-panel">
            <span class="control-label">Jake</span>
            <button id="jake-minus">-</button>
            <input type="number" id="jake-input" value="0">
            <button id="jake-plus">+</button>
        </div>
        <div class="control-panel">
            <span class="control-label">Joe</span>
            <button id="joe-minus">-</button>
            <input type="number" id="joe-input" value="0">
            <button id="joe-plus">+</button>
        </div>
    </div>

    <script>
        // State Management
        let deaths = {
            jake: parseInt(localStorage.getItem('wow_deaths_jake')) || 0,
            joe: parseInt(localStorage.getItem('wow_deaths_joe')) || 0
        };

        const jakeDisplay = document.getElementById('jake-display');
        const joeDisplay = document.getElementById('joe-display');
        const jakeInput = document.getElementById('jake-input');
        const joeInput = document.getElementById('joe-input');

        function updateCounter(player, val) {
            deaths[player] = Math.max(0, parseInt(val) || 0);
            
            if (player === 'jake') {
                jakeDisplay.textContent = deaths.jake;
                jakeInput.value = deaths.jake;
                localStorage.setItem('wow_deaths_jake', deaths.jake);
            } else {
                joeDisplay.textContent = deaths.joe;
                joeInput.value = deaths.joe;
                localStorage.setItem('wow_deaths_joe', deaths.joe);
            }
        }

        // Initialize displays with saved values
        updateCounter('jake', deaths.jake);
        updateCounter('joe', deaths.joe);

        // Jake Event Listeners
        document.getElementById('jake-minus').addEventListener('click', () => updateCounter('jake', deaths.jake - 1));
        document.getElementById('jake-plus').addEventListener('click', () => updateCounter('jake', deaths.jake + 1));
        jakeInput.addEventListener('input', (e) => updateCounter('jake', e.target.value));

        // Joe Event Listeners
        document.getElementById('joe-minus').addEventListener('click', () => updateCounter('joe', deaths.joe - 1));
        document.getElementById('joe-plus').addEventListener('click', () => updateCounter('joe', deaths.joe + 1));
        joeInput.addEventListener('input', (e) => updateCounter('joe', e.target.value));
    </script>

</body>
</html>
