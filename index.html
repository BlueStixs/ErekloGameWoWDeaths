<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WoW Death Counter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap');

        body {
            margin: 0;
            padding: 20px;
            background-color: transparent;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
        }

        /* Main OBS Widget Box */
        .widget-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 440px;
            height: 95px;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            border: 2px solid #c79c2e; /* WoW Gold Accent */
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            padding: 0 20px;
            box-sizing: border-box;
        }

        .left-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .main-label {
            font-size: 26px;
            font-weight: 900;
            color: #c79c2e; /* WoW Gold */
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            line-height: 1.1;
        }

        .right-section {
            display: flex;
            gap: 10px;
        }

        .counter-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(25, 25, 25, 0.8);
            border: 1px solid #444;
            border-radius: 8px;
            width: 85px;
            height: 65px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .counter-value {
            font-size: 30px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.1;
        }

        .counter-sub {
            font-size: 8px;
            font-weight: 700;
            color: #888888;
            margin-top: 2px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- OBS Widget Display -->
    <div class="widget-container">
        <div class="left-section">
            <div class="main-label">DEATHS</div>
        </div>
        <div class="right-section">
            <div class="counter-box">
                <div class="counter-value" id="jake-display">Loading...</div>
                <div class="counter-sub">JAKE</div>
            </div>
            <div class="counter-box">
                <div class="counter-value" id="joe-display">Loading...</div>
                <div class="counter-sub">JOE</div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const SPREADSHEET_ID = '15jYccCuwQgF6j7znFmTJIWanspwnGv4WkUVA8Vb_tk0';
        const API_KEY = 'AIzaSyAIZkvjBQ65t2rS3WE6NpAJOOoibWhTasU';
        
        // Define the specific cell range for each player
        const JAKE_RANGE = 'Sheet1!A2'; 
        const JOE_RANGE = 'Sheet1!B2'; 
        
        const REFRESH_RATE = 3000; // Time in milliseconds (3000ms = 3 seconds)

        async function fetchCellValue(range) {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${range}?key=${API_KEY}`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                if (data.values && data.values[0] && data.values[0][0] !== undefined) {
                    return data.values[0][0];
                }
                return '0';
            } catch (error) {
                console.error(`Error fetching data for range ${range}:`, error);
                return null;
            }
        }

        async function updateCounters() {
            // Fetch both values concurrently
            const [jakeVal, joeVal] = await Promise.all([
                fetchCellValue(JAKE_RANGE),
                fetchCellValue(JOE_RANGE)
            ]);

            if (jakeVal !== null) {
                document.getElementById('jake-display').textContent = jakeVal;
            }
            if (joeVal !== null) {
                document.getElementById('joe-display').textContent = joeVal;
            }
        }

        // Fetch values immediately on page load
        updateCounters();

        // Automatically update the counters every X seconds
        setInterval(updateCounters, REFRESH_RATE);
    </script>

</body>
</html>
